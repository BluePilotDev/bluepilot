# bp-sunnypilot: bump PRs for opendbc_repo (ford-op/bg-opendbc) when its bg-clean moves (spec:
# ford-op/bg-opendbc#89). Only opendbc_repo: the other submodules follow sunnypilot through the weekly sync.
version: 2
updates:
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    target-branch: master-local-lateral
    allow:
      - dependency-name: opendbc_repo
    labels: []
    commit-message:
      prefix: "opendbc_repo:"
