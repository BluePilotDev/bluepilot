# bp-sunnypilot: run tests.yaml on merges into master-local-lateral too. Upstream's push trigger is
# `master` only, which this repo doesn't have; calling it keeps upstream's file unchanged there.
name: bp tests

on:
  push:
    branches:
      - master-local-lateral

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
    with:
      run_number: ${{ github.run_number }}
