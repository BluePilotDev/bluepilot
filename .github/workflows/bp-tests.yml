# bp-sunnypilot: run tests.yaml on merges into the bp-sunnypilot branch too. Upstream's push trigger is
# `master` only, which this repo doesn't have; calling it keeps upstream's file unchanged there.
name: bp tests

on:
  push:
    branches:
      - bp-sunnypilot

jobs:
  tests:
    uses: ./.github/workflows/tests.yaml
    with:
      run_number: ${{ github.run_number }}
    secrets: inherit  # the process-replay publish step pushes with the bluepilot-sync App
