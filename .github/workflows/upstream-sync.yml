# BluePilot: nightly upstream sync (spec: #6). Fast-forwards `sunnypilot-clean` to sunnypilot
# `master` and keeps one PR open from it into `bp-sunnypilot`. When sunnypilot moves its opendbc
# pin, it builds the resolve itself (#31): the PR then comes from a `sync/resolve-*` branch with
# `opendbc_repo` at the BluePilotDev/opendbc commit that has the pin. It never merges and never force-pushes: if
# `sunnypilot-clean` is not a fast-forward of upstream it stops and opens an issue.
name: upstream sync

on:
  schedule:
    - cron: '17 7 * * *'  # nightly, 07:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-sync

jobs:
  sync:
    if: github.repository == 'BluePilotDev/bp-sunnypilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    # GITHUB_TOKEN can't be used: pushes and PRs made with it don't start CI. The bluepilot-sync
    # App's PRs run CI normally.
    - uses: actions/create-github-app-token@v2
      id: app
      with:
        app-id: ${{ secrets.SYNC_APP_ID }}
        private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
    # History only: no LFS, and the working tree is just .github.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ steps.app.outputs.token }}
        sparse-checkout: .github
    - name: Sync
      id: sync
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        REPO: ${{ github.repository }}
        UPSTREAM_URL: https://github.com/sunnypilot/sunnypilot.git
        MIRROR: sunnypilot-clean
        INTEGRATION: bp-sunnypilot
        OPENDBC: BluePilotDev/opendbc
        OPENDBC_BRANCH: bp-opendbc
        LIBRARY: BluePilotDev/bluepilot-lateral
      run: |
        set -euo pipefail
        git fetch --no-tags origin "$INTEGRATION"
        integration=$(git rev-parse "origin/$INTEGRATION")
        mirror=$(git rev-parse -q --verify "refs/remotes/origin/$MIRROR" || true)  # empty on the first run; the checkout fetched every branch
        git fetch --no-tags "$UPSTREAM_URL" master
        up=$(git rev-parse FETCH_HEAD)

        # 1. Fast-forward the mirror (creating it on the first run), or stop and say why.
        if [ "$mirror" != "$up" ]; then
          if [ -n "$mirror" ] && ! git merge-base --is-ancestor "$mirror" "$up"; then
            title="$MIRROR is not a mirror"
            {
              echo "The nightly sync stopped: \`$MIRROR\` is not a fast-forward of sunnypilot \`master\` ($up)."
              echo
              echo "Commits on \`$MIRROR\` that upstream doesn't have:"
              echo '```'
              git log --format='%h %ad %an | %s' --date=short "$up..$mirror"
              echo '```'
              echo "Fix \`$MIRROR\` by hand (it may only ever equal upstream), then re-run the job. The job never force-pushes."
            } > issue.md
            num=$(gh issue list -R "$REPO" --state open --search "in:title \"$title\"" --json number,title \
                  -q "map(select(.title == \"$title\")) | .[0].number // empty")
            if [ -n "$num" ]; then gh issue edit "$num" -R "$REPO" --body-file issue.md; else gh issue create -R "$REPO" --title "$title" --body-file issue.md; fi
            echo "::error::$MIRROR is not a fast-forward of upstream; see the issue"
            exit 1
          fi
          git push origin "$up:refs/heads/$MIRROR"
        fi

        # 2. Nothing to do if the integration branch already has upstream.
        if git merge-base --is-ancestor "$up" "$integration"; then
          echo "$INTEGRATION already contains upstream $up"
          exit 0
        fi

        # 3. Open or refresh the one sync PR (head = the mirror itself).
        base=$(git merge-base "$up" "$integration")
        out=$(git merge-tree --write-tree --name-only --no-messages "$integration" "$up") || true
        # exit 1 means conflicts or an error; only a real result starts with the merged tree's ID
        grep -qE '^[0-9a-f]{40}$' <<<"$(head -n1 <<<"$out")" || { echo "::error::merge-tree failed"; exit 1; }
        tree=$(head -n1 <<<"$out")
        conflicts=$(tail -n +2 <<<"$out")
        upstream_opendbc=$(git rev-parse "$up:opendbc_repo")
        our_opendbc=$(git rev-parse "$integration:opendbc_repo")
        overlap=$(comm -12 <(git diff --name-only "$base" "$up" | sort) <(git diff --name-only "$base" "$integration" | sort))
        files() { n=$(wc -l <<<"$1" | tr -d ' '); [ "$n" = 1 ] && echo "1 file" || echo "$n files"; }  # $1 is non-empty

        # opendbc: bp-opendbc contains sunnypilot's opendbc when the compare from it to bp-opendbc is "ahead" or
        # "identical"; a 404 means BluePilotDev/opendbc doesn't have the commit at all yet
        if status=$(gh api "repos/$OPENDBC/compare/$upstream_opendbc...$OPENDBC_BRANCH" -q .status 2>compare.err); then
          case "$status" in ahead|identical) ready=yes ;; *) ready=no ;; esac
        elif grep -q "HTTP 404" compare.err; then
          ready=no
        else
          cat compare.err >&2
          ready=unknown
        fi
        case "$ready" in
          yes) opendbc_row="| ✅ | opendbc | $OPENDBC \`$OPENDBC_BRANCH\` contains sunnypilot's pin \`${upstream_opendbc:0:8}\` |" ;;
          no) opendbc_row="| ❌ | opendbc | $OPENDBC \`$OPENDBC_BRANCH\` doesn't contain sunnypilot's pin \`${upstream_opendbc:0:8}\` yet: the $OPENDBC sync that brings it in lands first |" ;;
          *) opendbc_row="| ⚠️ | opendbc | unknown: the compare API failed (see the job log) |" ;;
        esac

        # bp-lateral row: the library a given opendbc_repo commit carries, against the library's latest release
        lateral_row() {  # <opendbc_repo commit> <what happens to opendbc_repo>
          local lib release tag
          if ! lib=$(gh api "repos/$OPENDBC/contents/opendbc/bluepilot_lateral?ref=$1" -q .sha 2>lib.err); then
            if grep -q "HTTP 404" lib.err; then echo "| ❌ | bp-lateral | $2, but \`${1:0:8}\` has no library at \`opendbc/bluepilot_lateral\` |"
            else cat lib.err >&2; echo "| ⚠️ | bp-lateral | $2; reading the library pointer failed (see the job log) |"; fi
          elif ! release=$(gh api "repos/$LIBRARY/branches/release" -q .commit.sha) || ! tag=$(gh api "repos/$LIBRARY/releases/latest" -q .tag_name); then
            echo "| ⚠️ | bp-lateral | $2 (library \`${lib:0:8}\`); reading the latest release failed (see the job log) |"
          elif [ "$lib" = "$release" ]; then
            echo "| ✅ | bp-lateral | $2, with the library at \`$tag\`, the latest release |"
          else
            echo "| ⚠️ | bp-lateral | $2, but its library \`${lib:0:8}\` isn't the latest release \`$tag\` (\`${release:0:8}\`): the release job's bump PR brings it, not this sync |"
          fi
        }

        # BluePilot (#31): when sunnypilot moved its opendbc pin and bp-opendbc already has it (BluePilotDev/opendbc syncs
        # first, BluePilotDev/opendbc#3), the job builds the resolve: the merge with opendbc_repo at the earliest
        # bp-opendbc commit containing the pin (the BluePilotDev/opendbc sync merge, never bp-opendbc's head, so a sync never
        # carries a library bump). Only when opendbc_repo is the one conflict. Git takes upstream's pointer
        # without a conflict when only upstream moved it, which this covers too.
        base_opendbc=$(git rev-parse "$base:opendbc_repo")
        merged_opendbc=$(git rev-parse -q --verify "$tree:opendbc_repo" || true)
        other_conflicts=$(grep -vx opendbc_repo <<<"$conflicts" || true)
        resolve=no target=""
        if [ "$upstream_opendbc" != "$base_opendbc" ] && [ "$ready" = yes ] && [ -z "$other_conflicts" ]; then
          # BluePilotDev/opendbc's history with trees but no file contents: enough for ancestry and the diffs below
          git fetch -q --no-tags --filter=blob:none "https://github.com/$OPENDBC.git" "$OPENDBC_BRANCH"
          if git merge-base --is-ancestor "$upstream_opendbc" "$our_opendbc"; then
            target=$our_opendbc  # this repo's opendbc already has the pin (say a library bump landed first): never move it back
          else
            for c in $(git rev-list --first-parent FETCH_HEAD); do
              git merge-base --is-ancestor "$upstream_opendbc" "$c" || break
              target=$c
            done
          fi
          [ -n "$target" ] && resolve=yes
        fi

        if [ "$resolve" = yes ]; then
          if [ "$target" = "$our_opendbc" ]; then
            lateral_row=$(lateral_row "$target" "\`opendbc_repo\` stays at \`${target:0:8}\`, which already has sunnypilot's pin \`${upstream_opendbc:0:8}\`")
          else
            lateral_row=$(lateral_row "$target" "\`opendbc_repo\` → \`${target:0:8}\`, the $OPENDBC sync merge that brought in sunnypilot's pin \`${upstream_opendbc:0:8}\`")
          fi
          # what the move changes: the panda's safety sources (not their tests), and the library pointer
          fw=$(git diff --name-only "$our_opendbc" "$target" -- opendbc/safety | grep -v '/tests/' || true)
          # the drive rule covers BluePilot's changes only: Ford safety, where BluePilot's hook lives (the library's
          # own safety code moves with the Library row). Upstream's other safety changes ride on CI.
          fw_ford=$(grep -x 'opendbc/safety/modes/ford.h' <<<"$fw" || true)
          fw_files() { awk '{printf "%s`%s`", (NR > 1 ? ", " : ""), $0}' <<<"$1"; }
          if [ -n "$fw_ford" ]; then
            firmware_row="| ⚠️ | Panda firmware | Ford safety changes ($(fw_files "$fw")): drive before merging |"
          elif [ -n "$fw" ]; then
            firmware_row="| ✅ | Panda firmware | upstream safety changes only ($(fw_files "$fw")): CI covers them, no drive |"
          else
            firmware_row="| ✅ | Panda firmware | unchanged |"
          fi
          lib_ours=$(git rev-parse "$our_opendbc:opendbc/bluepilot_lateral") lib_target=$(git rev-parse "$target:opendbc/bluepilot_lateral")
          if [ "$lib_ours" = "$lib_target" ]; then
            library_row="| ✅ | Library | unchanged at \`${lib_ours:0:8}\` |"
          else
            library_row="| ⚠️ | Library | moves \`${lib_ours:0:8}\` → \`${lib_target:0:8}\`, a lateral change: drive before merging |"
          fi
        elif grep -qx opendbc_repo <<<"$conflicts"; then
          lateral_row="| ❌ | bp-lateral | \`opendbc_repo\` conflicts: point it at the $OPENDBC \`$OPENDBC_BRANCH\` commit that contains sunnypilot's pin \`${upstream_opendbc:0:8}\` in a resolve PR |"
        elif [ "$merged_opendbc" != "$our_opendbc" ]; then
          lateral_row="| ❌ | bp-lateral | the merge takes \`opendbc_repo\` \`${merged_opendbc:0:8}\` instead of \`${our_opendbc:0:8}\`: BluePilot's library would drop out; point it at the $OPENDBC \`$OPENDBC_BRANCH\` commit that contains \`${merged_opendbc:0:8}\` in a resolve PR |"
        else
          lateral_row=$(lateral_row "$our_opendbc" "the merge keeps \`opendbc_repo\` at \`${our_opendbc:0:8}\`")
        fi

        if [ "$resolve" = yes ] && [ -n "$conflicts" ]; then
          conflicts_row="| ✅ | Conflicts | \`opendbc_repo\`, resolved by the job (see bp-lateral) |"
        elif [ -n "$conflicts" ]; then
          conflicts_row="| ❌ | Conflicts | $(files "$conflicts"), listed below: resolve them in a PR that merges this branch |"
        else
          conflicts_row="| ✅ | Conflicts | none |"
        fi
        if [ -n "$overlap" ]; then
          overlap_row="| ⚠️ | Overlap | $(files "$overlap") upstream changed that BluePilot also changes, listed below: look at each before merging |"
        else
          overlap_row="| ✅ | Overlap | none |"
        fi

        # same-repo resolve PRs only: the repo is public, so anyone can open a PR from a fork's sync/resolve-x
        open_resolve() { gh pr list -R "$REPO" --base "$INTEGRATION" --state open --json number,headRefName,isCrossRepository \
          -q 'map(select((.headRefName | startswith("sync/resolve-")) and (.isCrossRepository | not))) | .[0] // empty | "\(.number) \(.headRefName)"'; }
        rpr=$(open_resolve)
        if [ "$resolve" = yes ]; then
          # one resolve PR at a time, rebuilt from the current bp-sunnypilot branch and upstream whenever either
          # moved. The previous resolve (an open PR's head, or a branch a failed run left) becomes an extra
          # parent, so the branch only fast-forwards.
          if [ -n "$rpr" ]; then read -r rnum branch <<<"$rpr"; else rnum="" branch="sync/resolve-${up:0:8}"; fi
          prev=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [ -n "$prev" ]; then git fetch -q --no-tags origin "$branch"; fi
          if [ -z "$prev" ] || ! git merge-base --is-ancestor "$integration" "$prev" || ! git merge-base --is-ancestor "$up" "$prev"; then
            export GIT_INDEX_FILE="$RUNNER_TEMP/resolve.idx"
            git read-tree "$tree"
            git update-index --cacheinfo "160000,$target,opendbc_repo"
            rtree=$(git write-tree)
            unset GIT_INDEX_FILE
            parents=(-p "$integration" -p "$up")
            if [ -n "$prev" ]; then parents+=(-p "$prev"); fi
            commit=$(git -c user.name="bluepilot-sync[bot]" -c user.email="bluepilot-sync[bot]@users.noreply.github.com" commit-tree "$rtree" "${parents[@]}" \
              -m "Merge sunnypilot master ${up:0:8}; opendbc_repo to $OPENDBC ${target:0:8}" \
              -m "sunnypilot moved its opendbc pin to ${upstream_opendbc:0:8}. opendbc_repo moves to the $OPENDBC commit that has it (${target:0:8}). Built by the nightly sync job (#31).")
            git push origin "$commit:refs/heads/$branch"
          fi
        fi

        {
          if [ "$resolve" = yes ]; then head_desc="\`$branch\`, the job's merge of \`$MIRROR\` with \`opendbc_repo\` resolved"; else head_desc="\`$MIRROR\` itself"; fi
          echo "❌ **Merge commit only: never squash or rebase, and don't delete the branch.** The head is $head_desc; a squash or rebase leaves upstream's commits out of \`$INTEGRATION\` (the sync merge check opens an issue if that happens)."
          echo
          echo "Automated nightly sync of sunnypilot \`master\` into \`$INTEGRATION\` (#6). Upstream \`${base:0:8}..${up:0:8}\`, $(git rev-list --count "$integration..$up") commits."
          echo
          echo "| | Check | Result |"
          echo "|---|---|---|"
          echo "$opendbc_row"
          echo "$lateral_row"
          echo "$conflicts_row"
          echo "$overlap_row"
          if [ "$resolve" = yes ]; then echo "$firmware_row"; echo "$library_row"; fi
          echo
          echo "### Upstream commits"
          git log -n 200 --format='- %h %s' "$integration..$up"
          more=$(( $(git rev-list --count "$integration..$up") - 200 ))
          if [ "$more" -gt 0 ]; then echo "- …and $more more"; fi
          if [ -n "$conflicts" ]; then
            echo
            echo "### Conflicts"
            awk '{print "- " $0}' <<<"$conflicts"
          fi
          if [ -n "$overlap" ]; then
            echo
            echo "### Files upstream changed that BluePilot also changes"
            awk '{print "- " $0}' <<<"$overlap"
          fi
        } > pr.md
        plain=$(gh pr list -R "$REPO" --head "$MIRROR" --base "$INTEGRATION" --state open --json number -q '.[0].number // empty')
        if [ "$resolve" = yes ]; then
          if [ -n "$rnum" ]; then
            pr=$rnum
            gh pr edit "$pr" -R "$REPO" --body-file pr.md
          else
            pr=$(gh pr create -R "$REPO" --head "$branch" --base "$INTEGRATION" --title "sync: sunnypilot master → $INTEGRATION (opendbc_repo resolved)" --body-file pr.md)
            pr=${pr##*/}
          fi
          # a plain sync PR stays open and closes as merged when the resolve lands (its head is in it)
          if [ -n "$plain" ]; then
            gh pr edit "$plain" -R "$REPO" --body "Resolved in #$pr: merge that one; this PR closes as merged with it."
          fi
        else
          if [ -n "$plain" ]; then
            pr=$plain
            gh pr edit "$pr" -R "$REPO" --body-file pr.md
          else
            pr=$(gh pr create -R "$REPO" --head "$MIRROR" --base "$INTEGRATION" --title "sync: sunnypilot master → $INTEGRATION" --body-file pr.md)
            pr=${pr##*/}
          fi
          # an open resolve PR the job can no longer keep current
          if [ -n "$rpr" ]; then
            gh pr edit "${rpr%% *}" -R "$REPO" --body "Superseded: tonight's sync can't be resolved by the job (#$pr has why); resolve it by hand there."
          fi
        fi

        # the review step below runs when anything conflicts or overlaps
        {
          echo "pr=$pr"; echo "base=$base"; echo "up=$up"; echo "integration=$integration"
          if [ -n "$conflicts$overlap" ]; then echo "review=yes"; fi
          echo "files<<EOF"; sort -u <<<"$(printf '%s\n%s\n' "$conflicts" "$overlap")" | sed '/^$/d'; echo "EOF"
          echo "conflicts<<EOF"; echo "$conflicts"; echo "EOF"
          if [ "$resolve" = yes ]; then echo "resolved=$target"; echo "firmware=$(tr '\n' ' ' <<<"$fw_ford")"; fi
        } >> "$GITHUB_OUTPUT"
    # BluePilot: a plain-English review of the conflicting and overlapping files, posted once per upstream
    # commit on the sync PR. Read-only: git diff/log/show only. The prompt is .github/sync-review-prompt.md.
    - name: Review conflicts and overlap
      if: steps.sync.outputs.review == 'yes'
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        REPO: ${{ github.repository }}
        PR: ${{ steps.sync.outputs.pr }}
        BASE: ${{ steps.sync.outputs.base }}
        UP: ${{ steps.sync.outputs.up }}
        INTEGRATION: ${{ steps.sync.outputs.integration }}
        FILES: ${{ steps.sync.outputs.files }}
        CONFLICTS: ${{ steps.sync.outputs.conflicts }}
        RESOLVED: ${{ steps.sync.outputs.resolved }}
        FIRMWARE: ${{ steps.sync.outputs.firmware }}
      run: |
        set -euo pipefail
        marker="<!-- sync-review $UP -->"
        if gh api "repos/$REPO/issues/$PR/comments" --paginate -q '.[].body' | grep -qF "$marker"; then
          echo "#$PR already has a review for $UP"
          exit 0
        fi
        npm install -g --silent @anthropic-ai/claude-code
        {
          cat .github/sync-review-prompt.md
          echo
          echo "## Inputs"
          echo "- BASE: $BASE"
          echo "- UPSTREAM: $UP"
          echo "- INTEGRATION: $INTEGRATION"
          echo "- Files that conflict: ${CONFLICTS:-none}"
          if [ -n "$RESOLVED" ]; then
            echo "- \`opendbc_repo\`: the job already resolved it in this PR, pointing it at $RESOLVED (the BluePilotDev/opendbc \`bp-opendbc\` commit with sunnypilot's new pin). Judge it resolved; base the verdict on the other files."
            if [ -n "${FIRMWARE// /}" ]; then
              echo "- The move changes Ford's panda safety ($FIRMWARE), where BluePilot's hook lives, so this PR gets a drive before it merges: never call it safe to merge as is; say what's left is the drive. Other upstream safety changes ride on CI and don't need a drive."
            fi
          fi
          echo "- Files to review (conflicts and overlap):"
          awk '{print "  - " $0}' <<<"$FILES"
        } > prompt.md
        claude -p "$(cat prompt.md)" --max-turns 40 \
          --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*)" < /dev/null > review.md
        [ -s review.md ] || { echo "::error::the review came back empty"; exit 1; }
        { echo "$marker"; cat review.md; } > comment.md
        gh pr comment "$PR" -R "$REPO" --body-file comment.md
