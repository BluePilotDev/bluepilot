# BluePilot: the BPx sync job (spec: #225). Merges this repo's bp-sunnypilot mirror into full BluePilot's work branch,
# with opendbc_repo at the ford-op/opendbc bp-full commit that has bp-sunnypilot's opendbc pin (merging that pin into
# bp-full first when it isn't there). Both PRs merge with merge commits on green; a conflict or a red check goes into
# one issue. The logic is in .github/bpx_sync.py. Full BluePilot only: this file doesn't exist in ford-op/bp-sunnypilot.
name: bpx sync

on:
  repository_dispatch:
    types: [bpx-sync]  # sent by ford-op/bp-sunnypilot's public-sync after it pushes the mirror
  workflow_dispatch:
    inputs:
      target:
        description: branch to sync into
        default: bp-7.1-dev

permissions: {}

concurrency:
  group: bpx-sync

jobs:
  sync:
    if: github.repository == 'BluePilotDev/bluepilot'
    runs-on: ubuntu-24.04
    environment: bpx-sync  # the App key and the review token; the environment is limited to the default branch
    timeout-minutes: 120  # two waits for required checks of up to 45 minutes each
    env:
      TARGET: ${{ inputs.target || 'bp-7.1-dev' }}
      GIT_LFS_SKIP_SMUDGE: 1
      # no submodules are checked out: a fetch that recursed into a moved gitlink would fail
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: fetch.recurseSubmodules
      GIT_CONFIG_VALUE_0: 'false'
    steps:
    # GITHUB_TOKEN can't be used: pushes and PRs made with it don't start CI. One App token per org.
    - uses: actions/create-github-app-token@v2
      id: bp
      with:
        app-id: ${{ secrets.SYNC_APP_ID }}
        private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        owner: BluePilotDev
        repositories: bluepilot
    - uses: actions/create-github-app-token@v2
      id: odbc
      with:
        app-id: ${{ secrets.SYNC_APP_ID }}
        private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        owner: ford-op
        repositories: opendbc
    # history and trees only (merge-tree fetches the few file contents it needs), no LFS, and the working tree is just
    # .github: a run with nothing to do stays cheap. Pushes use the App token's URL.
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        filter: blob:none
        sparse-checkout: .github
        persist-credentials: false
    - name: 'Step 1: bp-full'
      id: bpfull
      env:
        BP_TOKEN: ${{ steps.bp.outputs.token }}
        ODBC_TOKEN: ${{ steps.odbc.outputs.token }}
      run: python3 .github/bpx_sync.py bp-full
    # fresh tokens: App tokens last an hour, and step 1 can wait 45 minutes
    - uses: actions/create-github-app-token@v2
      id: bp2
      if: steps.bpfull.outputs.ready == 'yes'
      with:
        app-id: ${{ secrets.SYNC_APP_ID }}
        private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        owner: BluePilotDev
        repositories: bluepilot
    - name: 'Step 2: the sync PR'
      id: prepare
      if: steps.bpfull.outputs.ready == 'yes'
      env:
        BP_TOKEN: ${{ steps.bp2.outputs.token }}
        BP_FULL_PR: ${{ steps.bpfull.outputs.bp_full_pr }}
      run: python3 .github/bpx_sync.py prepare
    # a plain-English review of the overlapping (on the PR) or conflicting (on the issue) files, once per bp-sunnypilot
    # commit. Read-only: git diff/log/show only. Advice: it never merges, labels or pushes, and a failure doesn't stop the merge.
    - name: Review overlap and conflicts
      if: ${{ !cancelled() && steps.prepare.outputs.review == 'yes' }}
      continue-on-error: true
      env:
        GH_TOKEN: ${{ steps.bp2.outputs.token }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        REPO: ${{ github.repository }}
        ON: ${{ steps.prepare.outputs.review_on }}
        BASE: ${{ steps.prepare.outputs.base }}
        UP: ${{ steps.prepare.outputs.up }}
        INTEGRATION: ${{ steps.prepare.outputs.integration }}
        Q: ${{ steps.prepare.outputs.q }}
        FILES: ${{ steps.prepare.outputs.files }}
        CONFLICTS: ${{ steps.prepare.outputs.conflicts }}
      run: |
        set -euo pipefail
        marker="<!-- bpx-sync-review $UP -->"
        if gh api "repos/$REPO/issues/$ON/comments" --paginate -q '.[].body' | grep -qF "$marker"; then
          echo "#$ON already has a review for $UP"
          exit 0
        fi
        npm install -g --silent @anthropic-ai/claude-code
        {
          cat .github/bpx-sync-review-prompt.md
          echo
          echo "## Inputs"
          echo "- BASE: $BASE"
          echo "- UPSTREAM: $UP"
          echo "- INTEGRATION: $INTEGRATION"
          echo "- \`opendbc_repo\`: resolved by the job to ford-op/opendbc \`bp-full\` $Q"
          echo "- Files that conflict: ${CONFLICTS:-none}"
          echo "- Files to review:"
          awk '{print "  - " $0}' <<<"$FILES"
        } > prompt.md
        claude -p "$(cat prompt.md)" --max-turns 40 \
          --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*)" < /dev/null > review.md
        [ -s review.md ] || { echo "::error::the review came back empty"; exit 1; }
        { echo "$marker"; cat review.md; } > comment.md
        gh issue comment "$ON" -R "$REPO" --body-file comment.md  # an issue or a PR: both take issue comments
    - uses: actions/create-github-app-token@v2
      id: bp3
      if: steps.prepare.outputs.pr != ''
      with:
        app-id: ${{ secrets.SYNC_APP_ID }}
        private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        owner: BluePilotDev
        repositories: bluepilot
    - name: 'Step 2: merge on green'
      if: steps.prepare.outputs.pr != ''
      env:
        BP_TOKEN: ${{ steps.bp3.outputs.token }}
        PR: ${{ steps.prepare.outputs.pr }}
        HEAD: ${{ steps.prepare.outputs.head }}
        T: ${{ steps.prepare.outputs.t }}
        Q: ${{ steps.prepare.outputs.q }}
      run: python3 .github/bpx_sync.py merge
