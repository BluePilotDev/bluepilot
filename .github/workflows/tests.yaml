name: tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      run_number:
        default: '1'
        required: true
        type: string

concurrency:
  group: tests-ci-run-${{ inputs.run_number }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && github.run_id || github.head_ref || github.ref }}-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CI: 1
  PYTHONPATH: ${{ github.workspace }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: lfs.fetchexclude
  GIT_CONFIG_VALUE_0: openpilot/selfdrive/modeld/models/big_driving_tinygrad.pkl

jobs:
  build_release:
    name: build release
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    env:
      STRIPPED_DIR: /tmp/releasepilot
      PYTHONPATH: /tmp/releasepilot
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive  # bp-sunnypilot: the library is a submodule inside opendbc_repo
    - name: Getting LFS files
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 2
        max_attempts: 3
        command: git lfs pull
    - name: Build devel
      timeout-minutes: 3
      run: TARGET_DIR=$STRIPPED_DIR tools/release/build_stripped.sh
    - run: ./tools/op.sh setup
    - name: Restore scons cache
      uses: actions/cache@v6
      with:
        path: /tmp/scons_cache
        key: scons-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: scons-${{ runner.os }}-${{ github.job }}-
    - name: Build openpilot and run checks
      timeout-minutes: 30
      working-directory: ${{ env.STRIPPED_DIR }}
      run: python3 openpilot/system/manager/build.py
    - name: Run tests
      timeout-minutes: 1
      working-directory: ${{ env.STRIPPED_DIR }}
      run: tools/release/check-dirty.sh
    - name: Check submodules
      if: github.repository == 'sunnypilot/sunnypilot'
      timeout-minutes: 3
      run: |
        if [ "${{ github.ref }}" != "refs/heads/master" ]; then
          git fetch  origin master:refs/remotes/origin/master

          SUBMODULE_PATHS=$(git diff origin/master HEAD --name-only | grep -E '^[^/]+$' | while read path; do
            if git ls-files --stage "$path" | grep -q "^160000"; then
              echo "$path"
            fi
          done | tr '\n' ' ')

          if [ -n "$SUBMODULE_PATHS" ]; then
            echo "Changed submodule paths: $SUBMODULE_PATHS"
            export SUBMODULE_PATHS="$SUBMODULE_PATHS"
            export CHECK_PR_REFS=true
          fi
        fi
        tools/release/check-submodules.sh

  build_mac:
    name: build macOS
    runs-on: ${{ ((github.repository == 'commaai/openpilot') && ((github.event_name != 'pull_request') || (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))) && 'namespace-profile-macos-8x14' || 'macos-latest' }}
    steps:
    - uses: actions/checkout@v7
    - name: Remove Homebrew from environment
      run: |
        FILTERED=$(echo "$PATH" | tr ':' '\n' | grep -v '/opt/homebrew' | tr '\n' ':')
        echo "PATH=${FILTERED}/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" >> $GITHUB_ENV
    - run: ./tools/op.sh setup
    - name: Restore scons cache
      uses: actions/cache@v6
      with:
        path: /tmp/scons_cache
        key: scons-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: scons-${{ runner.os }}-${{ github.job }}-
    - name: Building openpilot
      run: scons

  static_analysis:
    name: static analysis
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Static analysis
      timeout-minutes: 1
      run: scripts/lint/lint.sh

  unit_tests:
    name: unit tests
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Install raylib headless dependencies
      if: ${{ !contains(runner.name, 'nsc') }}
      run: sudo apt-get install -y --no-install-recommends libgles2 libegl1
    - name: Restore scons cache
      uses: actions/cache@v6
      with:
        path: /tmp/scons_cache
        key: scons-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: scons-${{ runner.os }}-${{ github.job }}-
    - name: Build openpilot
      run: scons
    - name: Run unit tests
      timeout-minutes: ${{ contains(runner.name, 'nsc') && 2 || 999 }}
      env:
        RAYLIB_BACKEND: headless
      run: tools/op.sh test

  process_replay:
    name: process replay
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Restore scons cache
      uses: actions/cache@v6
      with:
        path: /tmp/scons_cache
        key: scons-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: scons-${{ runner.os }}-${{ github.job }}-
    - name: Build openpilot
      run: scons
    - name: Check for the replay-accepted label  # BluePilot: a PR's replay difference passes only with the label
      id: accepted
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: echo "label=$(gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels --jq 'any(.[]; .name == "replay-accepted")')" >> "$GITHUB_OUTPUT"
    - name: Run replay
      timeout-minutes: ${{ contains(runner.name, 'nsc') && 2 || 20 }}
      continue-on-error: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/master-local-lateral' || steps.accepted.outputs.label == 'true' }}
      run: openpilot/selfdrive/test/process_replay/test_processes.py -j$(nproc)
    - name: Print diff
      id: print-diff
      if: always()
      run: cat openpilot/selfdrive/test/process_replay/diff.txt
    - name: Print diff report
      if: always()
      run: cat openpilot/selfdrive/test/process_replay/diff_report.txt
    - uses: actions/upload-artifact@v7
      if: always()
      continue-on-error: true
      with:
        name: process_replay_diff.txt
        path: openpilot/selfdrive/test/process_replay/diff.txt
    - name: Upload diff report
      uses: actions/upload-artifact@v7
      if: always() && github.event_name == 'pull_request'
      continue-on-error: true
      with:
        name: diff_report_${{ github.event.number }}
        path: openpilot/selfdrive/test/process_replay/diff_report.txt
    - name: Checkout ci-artifacts
      if: github.repository == 'sunnypilot/sunnypilot' && github.ref == 'refs/heads/master'
      uses: actions/checkout@v7
      with:
        repository: sunnypilot/ci-artifacts
        ssh-key: ${{ secrets.CI_ARTIFACTS_DEPLOY_KEY }}
        path: ${{ github.workspace }}/ci-artifacts
    - name: Prepare refs
      if: github.repository == 'sunnypilot/sunnypilot' && github.ref == 'refs/heads/master'
      working-directory: ${{ github.workspace }}/ci-artifacts
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
        git fetch origin process-replay || true
        git checkout process-replay 2>/dev/null || git checkout --orphan process-replay
        cp ${{ github.workspace }}/openpilot/selfdrive/test/process_replay/fakedata/*.zst .
        echo "${{ github.sha }}" > ref_commit
        git add .
        git commit -m "process-replay refs for ${{ github.repository }}@${{ github.sha }}" || echo "No changes to commit"
    - name: Push refs
      if: github.repository == 'sunnypilot/sunnypilot' && github.ref == 'refs/heads/master'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60
      with:
        timeout_minutes: 2
        max_attempts: 3
        command: cd ${{ github.workspace }}/ci-artifacts && git push origin process-replay --force
    - name: Publish BluePilot refs  # BluePilot: test_processes.py's BP_REF_CARS compare against this branch
      if: github.repository == 'ford-op/bp-sunnypilot' && github.ref == 'refs/heads/master-local-lateral'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        fakedata=${{ github.workspace }}/openpilot/selfdrive/test/process_replay/fakedata
        segs=$(python3 -c "from openpilot.selfdrive.test.process_replay.test_processes import segments, BP_REF_CARS; print(' '.join(s.replace('|', '_') for c, s in segments if c in BP_REF_CARS))")
        repo="https://github.com/${{ github.repository }}.git"
        # a later merge publishes its own refs; this one's would overwrite them
        [ "$(git ls-remote "$repo" refs/heads/master-local-lateral | cut -f1)" = "${{ github.sha }}" ] || { echo "not the branch head, skipping"; exit 0; }
        mkdir "$RUNNER_TEMP/bp-refs" && cd "$RUNNER_TEMP/bp-refs" && git init -q -b process-replay
        # keep the two previous refs too: a PR run that read an older ref_commit (or a cached one) still finds its
        # files when merges land minutes apart. ref_commits lists the kept refs, newest last.
        keep=""
        if git fetch -q --depth=1 "$repo" process-replay; then
          git checkout -q FETCH_HEAD -- .
          keep=$( { cat ref_commits 2>/dev/null || cat ref_commit; } | grep -vx "${{ github.sha }}" | tail -n 2)
          for f in *.zst; do
            c=${f##*_}
            grep -qx "${c%.zst}" <<<"$keep" || rm -f "$f"
          done
        fi
        for seg in $segs; do cp "$fakedata/${seg}"_*_${{ github.sha }}.zst .; done
        { if [ -n "$keep" ]; then echo "$keep"; fi; echo "${{ github.sha }}"; } > ref_commits
        echo "${{ github.sha }}" > ref_commit
        git add -A
        git -c user.name="GitHub Actions Bot" -c user.email="<>" commit -qm "process-replay refs for ${{ github.repository }}@${{ github.sha }}"
        git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" process-replay

  simulator_driving:
    name: simulator driving
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    if: false  # FIXME: Started to timeout recently
    steps:
    - uses: actions/checkout@v7
    - run: ./tools/op.sh setup
    - name: Build openpilot
      run: scons
    - name: Driving test
      timeout-minutes: 2
      env:
        # MetaDrive renders offscreen through panda3d's EGL pipe on llvmpipe
        EGL_PLATFORM: surfaceless
      run: python openpilot/tools/sim/tests/test_metadrive_bridge.py

  create_ui_report:
    name: Create UI Report
    runs-on: ${{
      (github.repository == 'commaai/openpilot') &&
      ((github.event_name != 'pull_request') ||
      (github.event.pull_request.head.repo.full_name == 'commaai/openpilot'))
      && fromJSON('["namespace-profile-amd64-8x16"]')
      || fromJSON('["ubuntu-24.04"]') }}
    steps:
      - uses: actions/checkout@v7
      - run: ./tools/op.sh setup
      - name: Install raylib headless dependencies
        if: ${{ !contains(runner.name, 'nsc') }}
        run: sudo apt-get install -y --no-install-recommends libgles2 libegl1
      - name: Restore scons cache
        uses: actions/cache@v6
        with:
          path: /tmp/scons_cache
          key: scons-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: scons-${{ runner.os }}-${{ github.job }}-
      - name: Build openpilot
        run: scons
      - name: Create UI Report
        env:
          RAYLIB_BACKEND: headless
        run: |
          python3 openpilot/selfdrive/ui/tests/diff/replay.py
          python3 openpilot/selfdrive/ui/tests/diff/replay.py --big
      - name: Upload UI Report
        uses: actions/upload-artifact@v7
        with:
          name: ui-report-${{ inputs.run_number || '1' }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'master' || github.event.number }}
          path: openpilot/selfdrive/ui/tests/diff/report
