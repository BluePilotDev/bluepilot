# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: ford
  title: Ford BluePilot Settings
  description: 'BluePilot is a Ford-focused enhancement, adding custom lateral control, longitudinal
    tuning, and Ford-specific visuals and driving aids. These settings let you fine-tune BluePilot’s
    high-level behavior for your Ford vehicle. Items are grouped by category ([System], [Vehicle],
    [Visuals], [Longitudinal Tuning], [Lateral Tuning]).'
  items:
  # --- System ---
  - key: BPUIDebugLog
    widget: toggle
    title: '[System] UI Debug Logging'
    description: Log UI state transitions for diagnosing rendering issues on device.
  - key: BPConnectBackend
    widget: option
    title: '[System] Connect Backend'
    description: Comma Connect uses stock servers. Konik Stable sends routes to stable.konik.ai (dongle ID switches
      automatically). Offline Mode points at unreachable hosts so uploads never succeed. Reboot to apply.
    needs_onroad_cycle: true
    options:
    - value: 0
      label: Comma Connect
    - value: 1
      label: Konik Stable
    - value: 2
      label: Offline Mode
  # --- Vehicle ---
  - key: send_hands_free_cluster_msg
    widget: toggle
    title: '[Vehicle] Show BlueCruise UI on Cluster'
    description: Display BlueCruise UI on the cluster for supported vehicles.
  - key: vbatt_pause_charging
    widget: option
    title: '[Vehicle] 12V Battery Limit'
    description: Set the 12V battery charging pause limit (11.0-14.0V).
    min: 11.0
    max: 14.0
    step: 0.1
    unit: V
  - key: FordPrefSteerAngleCurvature
    widget: toggle
    needs_onroad_cycle: true
    title: '[Vehicle] Use Pinion Yaw Sensor'
    description: 'Measures how the car is turning from the steering pinion angle sensor
      instead of the RCM yaw sensor, in both the control software and the panda safety
      firmware. Use this if your Ford has a faulty yaw sensor: frequent "Turn Exceeds
      Steering Limit" warnings and weak curve tracking with healthy steering, often
      alongside "Service AdvanceTrac" messages. Run tools/ford_yaw_health_check.py on a
      few drives to check. Takes effect the next time the car starts. Not available on
      the Edge (its pinion sensor only reports a relative angle).'
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/not_ford_edge_mk2'
  # --- Audio ---
  - key: BPUseCustomSounds
    widget: toggle
    needs_onroad_cycle: true
    title: '[Audio] Use Custom Engage/Disengage Sounds'
    description: Replace the engage and disengage sounds with the selected sound pack. For these sound changes to take effect, you will need to reboot your device.
    enablement:
    - $ref: '#/macros/offroad'
  - key: BPCustSoundsSelection
    widget: multiple_button
    needs_onroad_cycle: true
    title: '[Audio] Engage/Disengage Sound'
    description: Choose the sound pack played when openpilot engages or disengages. For these sound changes to take effect, you will need to reboot your device.
    options:
    - value: 0
      label: Comma 4
    - value: 1
      label: Comma 3x
    - value: 2
      label: Tesla
    enablement:
    - $ref: '#/macros/offroad'
    - type: param
      key: BPUseCustomSounds
      equals: true
  # --- Visuals ---
  - key: BPHideOnroadBorder
    widget: toggle
    title: '[Visuals] Hide Onroad Border'
    description: Hide the colored status border around the driving view.
  - key: mici_hide_onroad_fade
    widget: toggle
    title: '[Visuals] Hide Onroad Fade (C4)'
    description: Hide the onroad fade overlay (comma 4).
    visibility:
    - $ref: '#/macros/mici_only'
  - key: BPDisableLaneLineStatusColor
    widget: toggle
    title: '[Visuals] Disable Lane Line Status Color'
    description: Keep lane lines grey instead of changing to green when engaged.
  - key: BPHideCameraView
    widget: toggle
    title: '[Visuals] Minimal Driving View'
    description: Disable camera feed & only show lane lines and model path.
  - key: BPRadRacerTheme
    widget: toggle
    title: '[Visuals] 8-Bit Racer Theme (C3X)'
    description: 'Retro 8-bit racing game onroad view: hides the camera feed, draws the road as green game lines, and moves
      all metrics into a gauge cluster at the bottom of the screen.'
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: BPRainbowLines
    widget: toggle
    title: '[Visuals] Rainbow Lane Lines'
    description: Inner lane lines become rainbow colored when longitudinal control is active.
  - key: ShowBlindspotOverlay
    widget: toggle
    title: '[Visuals] Show Blindspot Overlay'
    description: Display red overlay when a vehicle is detected in the blindspot.
  - key: ShowBrakeStatus
    widget: toggle
    title: '[Visuals] Show Brake Status'
    description: Display the speed setpoint in red when the vehicle is braking.
  - key: BPShowConfidenceBall
    widget: toggle
    title: '[Visuals] Show Confidence Ball (C3X)'
    description: Display the confidence ball on the left side of the driving view.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: BPAnimateSteeringWheel
    widget: toggle
    title: '[Visuals] Animate Steering Wheel'
    description: Rotate the steering wheel icon to match the current steering angle.
  # ==================== BLUEPILOT SUNNYLINK ICON STYLES ====================
  - key: BPSteeringWheelIconStyle
    widget: multiple_button
    title: '[Visuals] Wheel Icon Style'
    description: Toggle wheel icon style between Comma 4 and Comma 3x wheel
    options:
    - value: 0
      label: Comma 4
    - value: 1
      label: Comma 3x
  - key: BPDMStylingChoice
    widget: multiple_button
    title: '[Visuals] DM Icon Style'
    description: Toggle Driver Monitoring icon style between Comma 4 and Comma 3x
    options:
    - value: 0
      label: Comma 4
    - value: 1
      label: Comma 3x
  # ================== END BLUEPILOT SUNNYLINK ICON STYLES ==================
  - key: BpShowLateralControl
    widget: toggle
    title: '[Visuals] Show Lateral Control Mode'
    description: Display the lateral control mode overlay on the steering wheel icon.
  - key: mici_complication
    widget: multiple_button
    title: '[Visuals] Lower Right Display (C4)'
    description: Choose what is shown in the lower-right corner of the driving view (comma 4).
    visibility:
    - $ref: '#/macros/mici_only'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Lead Car Speed
    - value: 2
      label: Speed
    - value: 3
      label: Lead Car Distance
    - value: 4
      label: Time to Lead Car
  - key: FordPrefShowRadarLeadOverlay
    widget: toggle
    title: '[Visuals] Show Radar Lead Overlay (Ford ACC)'
    description: Display a chevron with lead vehicle info when using Ford stock ACC.
  - key: FordPrefRadarOverlaySize
    widget: multiple_button
    title: '[Visuals] Radar Overlay Size'
    description: Set the size of the radar lead overlay chevron and info boxes.
    options:
    - value: 0
      label: Small
    - value: 1
      label: Medium
    - value: 2
      label: Large
    enablement:
    - type: param
      key: FordPrefShowRadarLeadOverlay
      equals: true
  - key: FordPrefHybridBatteryStatus
    widget: toggle
    title: '[Visuals] Show Hybrid/EV Battery Status'
    description: Display the hybrid battery gauge with SOC, voltage, and amps.
  - key: FordPrefHybridPowerFlow
    widget: toggle
    title: '[Visuals] Show Hybrid/EV Power Flow'
    description: Display the power flow gauge showing throttle demand and regenerative braking.
  - key: FordPrefHybridDriveGaugeSize
    widget: multiple_button
    title: '[Visuals] Hybrid/EV Gauge Size (C3X)'
    description: Set the size of the battery and power flow gauges.
    visibility:
    - $ref: '#/macros/hide_on_mici'
    options:
    - value: 1
      label: Small
    - value: 2
      label: Large
    enablement:
    - type: param
      key: FordPrefHybridPowerFlow
      equals: true
  - key: FordPrefGaugeStyle
    widget: multiple_button
    title: '[Visuals] Hybrid Gauge Style (C3X)'
    description: 'Flat: horizontal bar in a shared container. Arched: arch above the torque bar.'
    visibility:
    - $ref: '#/macros/hide_on_mici'
    options:
    - value: 0
      label: Flat
    - value: 1
      label: Arched
    enablement:
    - type: param
      key: FordPrefHybridPowerFlow
      equals: true
  - key: FordPrefHybridPowerFlowAlternate
    widget: toggle
    title: '[Visuals] Hybrid/EV Gauge Style: Round (C4)'
    description: 'Off shows the flat style; on shows the round style (comma 4).'
    visibility:
    - $ref: '#/macros/mici_only'
    enablement:
    - type: param
      key: FordPrefHybridPowerFlow
      equals: true
  # --- Longitudinal Tuning ---
  - key: disable_BP_long_UI
    widget: toggle
    title: '[Longitudinal Tuning] Bypass BP Longitudinal Control'
    description: Use stock longitudinal logic instead of BluePilot TTC/coasting tuning.
  - key: disable_downhill_comp_UI
    widget: toggle
    title: '[Longitudinal Tuning] Disable Downhill Compensation'
    description: Disable pitch-based brake/gas compensation when going downhill.
  - key: disable_ford_radar_UI
    widget: toggle
    title: '[Longitudinal Tuning] Disable Ford Radar (Vision-Only Leads)'
    description: Ignore the vehicle radar and drive leads exclusively from the vision model. Requires reboot.
    needs_onroad_cycle: true
  # --- Lateral Tuning ---
  # Mirrors the on-device BluePilot menu: disable toggle and mode selector up top, mode-agnostic
  # items next, then the angle-only and curvature-only groups (hidden when the other control
  # scheme is selected; param keys carry the matching _ang/_curv suffix).
  - key: disable_BP_lat_UI
    widget: toggle
    title: '[Lateral Tuning] Disable BP Lateral Control'
    description: Disable BluePilot 4-signal Ford lateral control.
  - key: FordPrefLateralControl
    widget: multiple_button
    title: '[Lateral Tuning] Primary Control Variable'
    description: Curvature uses the existing 4-signal strategy. Angle uses path_angle as the primary actuator (in development).
    options:
    - value: 0
      label: Curvature
    - value: 1
      label: Angle
  - key: BlinkerPauseLaneChange
    widget: toggle
    title: '[Lateral Tuning] Disable Lane Change Under Speed'
    description: Pause lateral control when the blinker is on and below the minimum speed.
  - key: BlinkerMinLateralControlSpeed
    widget: option
    title: '[Lateral Tuning] Minimum Speed to Pause Lane Change'
    description: Below this speed, lateral control is paused when the blinker is active.
    min: 5
    max: 50
    step: 1
    enablement:
    - type: param
      key: BlinkerPauseLaneChange
      equals: true
  # Angle-mode tuning (hidden unless Primary Control Variable = Angle)
  - key: FordLowSpeedFactor_ang
    widget: option
    title: '[Lateral Tuning] Low Speed Adjustment Factor (Angle)'
    description: Scales the low-speed steering response in angle mode (0.5-1.5). Default 1.0.
    min: 0.5
    max: 1.5
    step: 0.01
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: FordHighSpeedFactor_ang
    widget: option
    title: '[Lateral Tuning] High Speed Adjustment Factor (Angle)'
    description: Scales the high-speed steering response in angle mode (0.5-1.5). Default 1.0.
    min: 0.5
    max: 1.5
    step: 0.01
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: FordHighSpeedDampening_ang
    widget: option
    title: '[Lateral Tuning] High Speed Low Curve Adjustment Factor (Angle)'
    description: Tune adjustment factor for low curve straightaways (highways) at high speeds. If oversteering, reduce. If understeering, increase
    min: 0.25
    max: 1.25
    step: 0.01
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: FordAngleAutoCal
    widget: toggle
    title: '[Lateral Tuning] Auto-Calibrate Adjustment Factors'
    description: Learns the low/high speed factors by comparing requested and actual turn, nudging them live until locked. Manual +/- always wins. Toggle off and back on to recalibrate.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: FordAngleSmoothing
    widget: toggle
    title: '[Lateral Tuning] Smooth Steering (Anti-Weave)'
    description: Master enable for the anti-weave smoothing of the angle command path. Strength below sets how much; 1.0 strength = stock either way.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: FordAngleSmoothStrength
    widget: option
    title: '[Lateral Tuning] Smoothing Strength'
    description: 1.0 = stock steering (no smoothing). Step up for more damping of straight-road weave; 2.0 = log-tuned, 2.5 = strongest. Curves unaffected.
    min: 1.0
    max: 2.5
    step: 0.1
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: lane_change_factor_high_ang
    widget: option
    title: '[Lateral Tuning] Lane Change Factor High (Angle)'
    description: Scales steering during a lane change in angle mode. Values >1.0 boost it.
    min: 0.85
    max: 1.5
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  # Curvature-mode tuning (hidden unless Primary Control Variable = Curvature)
  - key: enable_human_turn_detection_curv
    widget: toggle
    title: '[Lateral Tuning] Enable Human Turn Detection (Curvature)'
    description: Enable detection of human-initiated turns.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: lane_change_factor_high_curv
    widget: option
    title: '[Lateral Tuning] Lane Change Factor High (Curvature)'
    description: Scales steering during a lane change in curvature mode. Values <1.0 reduce it.
    min: 0.5
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: enable_lane_positioning_curv
    widget: toggle
    title: '[Lateral Tuning] Enable Lane Positioning (Curvature)'
    description: Enable custom lane positioning controls.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: custom_path_offset_curv
    widget: option
    title: '[Lateral Tuning] In-Lane Offset (Curvature)'
    description: Adjust the in-lane offset (-0.5 to 0.5 m).
    min: -0.5
    max: 0.5
    step: 0.05
    unit: m
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: enable_lane_positioning_curv
      equals: true
  - key: enable_lane_full_mode_curv
    widget: toggle
    title: '[Lateral Tuning] Enable Lanefull Mode (Curvature)'
    description: Enable lanefull mode for lane positioning.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: enable_lane_positioning_curv
      equals: true
  - key: custom_profile_curv
    widget: toggle
    title: '[Lateral Tuning] Use Custom Tuning Profile (Curvature)'
    description: Enable custom tuning profile settings.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: pc_blend_ratio_high_C_UI_curv
    widget: option
    title: '[Lateral Tuning] Predicted Curvature Blend Ratio High (Curvature)'
    description: Adjust the high curvature blend ratio (0.0-1.0).
    min: 0.0
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: custom_profile_curv
      equals: 1
  - key: pc_blend_ratio_low_C_UI_curv
    widget: option
    title: '[Lateral Tuning] Predicted Curvature Blend Ratio Low (Curvature)'
    description: Adjust the low curvature blend ratio (0.0-1.0).
    min: 0.0
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: custom_profile_curv
      equals: 1
  - key: LC_PID_gain_UI_curv
    widget: option
    title: '[Lateral Tuning] Centering PID Gain (Curvature)'
    description: PID gain for the curvature-mode centering controller (only effective when the custom tuning profile is enabled).
    min: 0.0
    max: 50.0
    step: 0.5
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: enable_lane_positioning_curv
      equals: true
    - type: param
      key: custom_profile_curv
      equals: 1
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
