# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Vehicle
icon: vehicle
order: 99
kind: vehicle
sections:
- id: ford
  # BluePilot: the lateral library's settings (params/manifest.py in BluePilotDev/bluepilot-lateral), with
  # BluePilot 7's titles, text and order. test_ford_settings.py checks the keys and limits against the
  # manifest. No disable toggle: BluePilot is always on in bp-sunnypilot.
  title: Ford BluePilot Settings
  description: BluePilot's Ford lateral control. Items are grouped by category ([Vehicle], [Lateral Tuning]).
  items:
  # --- Vehicle ---
  - key: FordPrefSteerAngleCurvature
    widget: toggle
    needs_onroad_cycle: true
    title: '[Vehicle] Use Pinion Yaw Sensor'
    description: 'Measures how the car is turning from the steering pinion angle sensor
      instead of the RCM yaw sensor, in both the control software and the panda safety
      firmware. Use this if your Ford has a faulty yaw sensor: frequent "Turn Exceeds
      Steering Limit" warnings and weak curve tracking with healthy steering, often
      alongside "Service AdvanceTrac" messages. Run tools/ford_yaw_health_check.py on a
      few drives to check. Takes effect the next time the car starts. Not available on
      the Edge (its pinion sensor only reports a relative angle).'
    enablement:
    - $ref: '#/macros/offroad'
  # --- Lateral Tuning ---
  # Offroad only: the panda treats the two modes differently, and nothing handles a switch while engaged.
  - key: FordPrefLateralControl
    widget: multiple_button
    title: '[Lateral Tuning] Primary Control Variable'
    description: Curvature uses the existing 4-signal strategy. Angle uses path_angle as the primary actuator (in development).
    options:
    - value: 0
      label: Curvature
    - value: 1
      label: Angle
    enablement:
    - $ref: '#/macros/offroad'
  # Angle-mode tuning (shown when Primary Control Variable = Angle)
  - key: FordLowSpeedFactor_ang
    widget: option
    title: '[Lateral Tuning] Low Speed Adjustment Factor (Angle)'
    description: Scales the low-speed steering response in angle mode (0.5-1.5). Default 1.0.
    min: 0.5
    max: 1.5
    step: 0.01
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: FordHighSpeedFactor_ang
    widget: option
    title: '[Lateral Tuning] High Speed Adjustment Factor (Angle)'
    description: Scales the high-speed steering response in angle mode (0.5-1.5). Default 1.0.
    min: 0.5
    max: 1.5
    step: 0.01
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: FordHighSpeedDampening_ang
    widget: option
    title: '[Lateral Tuning] High Speed Low Curve Adjustment Factor (Angle)'
    description: Tune adjustment factor for low curve straightaways (highways) at high speeds. If oversteering, reduce. If understeering, increase
    min: 0.25
    max: 1.25
    step: 0.01
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: lane_change_factor_high_ang
    widget: option
    title: '[Lateral Tuning] Lane Change Factor High (Angle)'
    description: Scales steering during a lane change in angle mode. Values >1.0 boost it.
    min: 0.85
    max: 1.5
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  # Not in BluePilot 7's sunnylink section; names and steps from its comma four menu
  - key: enable_lane_positioning_ang
    widget: toggle
    title: '[Lateral Tuning] Enable Lane Positioning (Angle)'
    description: Nudge the vehicle toward true lane-line center (plus optional bias) while in angle-primary control.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
  - key: custom_path_offset_ang
    widget: option
    title: '[Lateral Tuning] In-Lane Offset (Angle)'
    description: Adjust the in-lane offset (-0.5 to 0.5 m).
    min: -0.5
    max: 0.5
    step: 0.01
    unit: m
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
    enablement:
    - type: param
      key: enable_lane_positioning_ang
      equals: true
  - key: lane_centering_strength_ang
    widget: option
    title: '[Lateral Tuning] Lane Centering Strength (Angle)'
    description: How much authority the lane centering trim has vs. the model's own path (0.0-1.0).
    min: 0.0
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 1
    enablement:
    - type: param
      key: enable_lane_positioning_ang
      equals: true
  # Curvature-mode tuning (shown when Primary Control Variable = Curvature)
  - key: enable_human_turn_detection_curv
    widget: toggle
    title: '[Lateral Tuning] Enable Human Turn Detection (Curvature)'
    description: Enable detection of human-initiated turns.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: lane_change_factor_high_curv
    widget: option
    title: '[Lateral Tuning] Lane Change Factor High (Curvature)'
    description: Scales steering during a lane change in curvature mode. Values <1.0 reduce it.
    min: 0.5
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: enable_lane_positioning_curv
    widget: toggle
    title: '[Lateral Tuning] Enable Lane Positioning (Curvature)'
    description: Enable custom lane positioning controls.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: custom_path_offset_curv
    widget: option
    title: '[Lateral Tuning] In-Lane Offset (Curvature)'
    description: Adjust the in-lane offset (-0.5 to 0.5 m).
    min: -0.5
    max: 0.5
    step: 0.05
    unit: m
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: enable_lane_positioning_curv
      equals: true
  - key: enable_lane_full_mode_curv
    widget: toggle
    title: '[Lateral Tuning] Enable Lanefull Mode (Curvature)'
    description: Enable lanefull mode for lane positioning.
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: enable_lane_positioning_curv
      equals: true
  # Stored as 0/1 (INT), so a two-choice button: sunnylink converts a saved value with the param's type
  - key: custom_profile_curv
    widget: multiple_button
    title: '[Lateral Tuning] Use Custom Tuning Profile (Curvature)'
    description: Enable custom tuning profile settings.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 'On'
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
  - key: pc_blend_ratio_high_C_UI_curv
    widget: option
    title: '[Lateral Tuning] Predicted Curvature Blend Ratio High (Curvature)'
    description: Adjust the high curvature blend ratio (0.0-1.0).
    min: 0.0
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: custom_profile_curv
      equals: 1
  - key: pc_blend_ratio_low_C_UI_curv
    widget: option
    title: '[Lateral Tuning] Predicted Curvature Blend Ratio Low (Curvature)'
    description: Adjust the low curvature blend ratio (0.0-1.0).
    min: 0.0
    max: 1.0
    step: 0.05
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: custom_profile_curv
      equals: 1
  # Applies whenever lane positioning is on (lateral_curv_ext.py), custom profile or not
  - key: LC_PID_gain_UI_curv
    widget: option
    title: '[Lateral Tuning] Centering PID Gain (Curvature)'
    description: PID gain for the curvature-mode centering controller. Applies whenever lane positioning is on.
    min: 0.0
    max: 50.0
    step: 0.5
    visibility:
    - type: param
      key: FordPrefLateralControl
      equals: 0
    enablement:
    - type: param
      key: enable_lane_positioning_curv
      equals: true
- id: hyundai
  title: Hyundai / Kia / Genesis Settings
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Custom Longitudinal Tuning
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dynamic
    - value: 2
      label: Predictive
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Subaru Settings
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go for Manual Parking Brake (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Tesla Settings
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Cooperative Steering (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: MADS Screen Activation
    description: 'Use a multi-finger press on the infotainment screen to toggle MADS.
      This allows the use of full MADS functionality when enabled. Selecting a higher
      finger count may reduce accidental activations. Note: Setting this to Off will
      reset your MADS settings to default.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3-Finger
    - value: 2
      label: 4-Finger
    - value: 3
      label: 5-Finger
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Toyota / Lexus Settings
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Enforce Factory Longitudinal Control
    description: sunnypilot will not take over control of gas and brakes. Factory Toyota longitudinal control will be used.
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Stop and Go Hack (Alpha)
    description: sunnypilot will allow some Toyota/Lexus cars to auto resume during stop and go traffic. This feature is only
      applicable to certain models that are able to use longitudinal control. This is an alpha feature. Use at your own risk.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
